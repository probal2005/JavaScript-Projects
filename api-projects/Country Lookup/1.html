<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wikipedia Country Lookup</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f8f9fa;
    font-family:Arial,Helvetica,sans-serif;
    padding-bottom:90px;
}

.container{
    max-width:850px;
}

.result{
    margin-top:30px;
}

.card{
    border:none;
    border-radius:15px;
}

.card img{
    max-height:320px;
    object-fit:contain;
    background:#f5f5f5;
    border-radius:10px;
}

.loading{
    text-align:center;
    font-size:22px;
    color:#6c757d;
    margin-top:30px;
}

.error{
    text-align:center;
    font-size:22px;
    color:#dc3545;
    margin-top:30px;
}

/* Footer */

.footer{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;

    background:#1e293b;
    color:#fff;

    padding:15px 10px;

    text-align:center;

    border-top:4px solid #0d6efd;

    box-shadow:0 -3px 10px rgba(0,0,0,.2);

    z-index:9999;
}

.footer-content{
    max-width:1200px;
    margin:auto;
}

.footer p{
    margin:4px 0;
}

.footer a{
    color:#4dabf7;
    text-decoration:none;
    font-weight:bold;
}

.footer a:hover{
    text-decoration:underline;
}

.footer i{
    color:red;
}

.copyright{
    font-size:13px;
    color:#cbd5e1;
}

    </style>

</head>

<body>

<div class="container mt-5">

    <h1 class="text-center mb-4">
        📖 Wikipedia Country Lookup
    </h1>

    <div class="row justify-content-center">

        <div class="col-md-8">

            <input
                type="text"
                id="countryInput"
                class="form-control form-control-lg"
                placeholder="Enter country name (India, Japan, Brazil...)">

        </div>

        <div class="col-md-2 mt-2 mt-md-0">

            <button
                class="btn btn-primary btn-lg w-100"
                id="searchBtn">

                Search

            </button>

        </div>

    </div>

    <div id="result" class="result"></div>

</div>

<!-- Footer -->

<footer class="footer">

    <div class="footer-content">

        <p>

            Designed with

            <i class="fa-solid fa-heart"></i>

            by

            <a href="https://www.linkedin.com/in/probal-dhali"
               target="_blank">

               Probal Dhali

            </a>

        </p>

        <p class="copyright">

            © 2026 All Rights Reserved.

        </p>

    </div>

</footer>

<script>

const input=document.getElementById("countryInput");

const btn=document.getElementById("searchBtn");

const result=document.getElementById("result");

btn.addEventListener("click",fetchCountry);

input.addEventListener("keydown",e=>{

    if(e.key==="Enter"){

        fetchCountry();

    }

});

async function fetchCountry(){

    const country=input.value.trim();

    if(country===""){

        result.innerHTML=`
        <div class="error">
        ⚠️ Please enter a country name.
        </div>
        `;

        return;

    }

    result.innerHTML=`
    <div class="loading">
        ⏳ Searching...
    </div>
    `;

    try{

        const response=await fetch(
        `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(country)}`
        );

        if(!response.ok){

            throw new Error("Country not found.");

        }

        const data=await response.json();

        result.innerHTML=`

        <div class="card shadow-lg">

            <div class="card-body">

                <h2 class="mb-3">

                    ${data.title}

                </h2>

                ${
                    data.thumbnail
                    ?
                    `<img src="${data.thumbnail.source}"
                    class="img-fluid mb-3">`
                    :
                    ""
                }

                <p>

                    ${data.extract}

                </p>

                <a
                    href="${data.content_urls.desktop.page}"
                    target="_blank"
                    class="btn btn-outline-primary">

                    📖 Read Full Article

                </a>

            </div>

        </div>

        `;

    }

    catch(err){

        result.innerHTML=`

        <div class="error">

            ❌ Country Not Found

        </div>

        `;

    }

}

</script>

</body>
</html>
