<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Issue Tracker Pro | Probal Dhali</title>

    <!-- Bootstrap -->

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">

    <!-- Font Awesome -->

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>

<body onload="fetchIssues()">

    <!-- Background Animation -->

    <div class="bg-animation">

        <span></span>
        <span></span>
        <span></span>
        <span></span>

    </div>

    <!-- Navbar -->

    <nav class="navbar glass">

        <div class="container">

            <h2>

                <i class="fa-solid fa-bug"></i>

                Issue Tracker Pro

            </h2>

            <button id="themeBtn">

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>

    </nav>

    <!-- Dashboard -->

    <section class="container mt-4">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card dashboard-card">

                    <h5>Total Issues</h5>

                    <h2 id="totalIssues">0</h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card dashboard-card open">

                    <h5>Open</h5>

                    <h2 id="openIssues">0</h2>

                </div>

            </div>

            <div class="col-md-4">

                <div class="card dashboard-card closed">

                    <h5>Closed</h5>

                    <h2 id="closedIssues">0</h2>

                </div>

            </div>

        </div>

    </section>

    <!-- Main -->

    <section class="container mt-5">

        <div class="row">

            <!-- Form -->

            <div class="col-lg-4">

                <div class="glass form-box">

                    <h3>

                        <i class="fa-solid fa-plus"></i>

                        Add New Issue

                    </h3>

                    <form id="issueInputForm">

                        <input
                            type="text"
                            class="form-control"
                            id="issueDescInput"
                            placeholder="Issue Description"
                            required>

                        <select
                            class="form-select mt-3"
                            id="issueSeverityInput">

                            <option>Low</option>

                            <option>Medium</option>

                            <option>High</option>

                        </select>

                        <input
                            type="text"
                            class="form-control mt-3"
                            id="issueAssignedToInput"
                            placeholder="Assigned To"
                            required>

                        <div class="d-grid gap-2 mt-4">

                            <button
                                class="btn btn-primary"
                                type="submit">

                                <i class="fa-solid fa-plus"></i>

                                Add Issue

                            </button>

                            <button
                                type="button"
                                id="clearAllBtn"
                                class="btn btn-danger">

                                <i class="fa-solid fa-trash"></i>

                                Clear All

                            </button>

                        </div>

                    </form>

                </div>

            </div>

            <!-- Issues -->

            <div class="col-lg-8">

                <div class="glass issue-panel">

                    <div class="toolbar">

    <input
        type="text"
        id="searchInput"
        placeholder="🔍 Search issues...">

    <select id="filterStatus">

        <option value="All">All Issues</option>

        <option value="Open">Open</option>

        <option value="Closed">Closed</option>

    </select>

    <button
        class="toolbar-btn"
        onclick="exportJSON()">

        <i class="fa-solid fa-file-export"></i>

        Export JSON

    </button>

    <button
        class="toolbar-btn"
        onclick="exportCSV()">

        <i class="fa-solid fa-file-csv"></i>

        Export CSV

    </button>

    <button
        class="toolbar-btn"
        onclick="restoreBackup()">

        <i class="fa-solid fa-clock-rotate-left"></i>

        Restore

    </button>

    <label class="toolbar-btn">

        <i class="fa-solid fa-file-import"></i>

        Import

        <input
            type="file"
            id="importFile"
            accept=".json"
            onchange="importJSON(event)"
            hidden>

    </label>

</div>

                    <div id="issuesList">

                        <!-- JS -->

                    </div>

                </div>

            </div>

        </div>

    </section>

    <!-- Floating Button -->

    <button id="scrollTop">

        <i class="fa-solid fa-arrow-up"></i>

    </button>

    <!-- Footer -->

    <footer>

        <div class="container">

            <p>

                Made with ❤️ using HTML, CSS & JavaScript

            </p>

            <p>

                © 2026

                <a
                    href="https://github.com/probal2005"
                    target="_blank">

                    Probal Dhali

                </a>

            </p>

        </div>

    </footer>

    <!-- Libraries -->

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <script src="https://chancejs.com/chance.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="script.js"></script>

</body>

</html>
