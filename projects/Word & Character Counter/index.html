<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="./assets/favic.ico" type="image/x-icon">

    <title>Word Char Counter</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Word & Character Counter</h1>

        <textarea 
            id="textArea" 
            placeholder="Type or paste your text here..."
            spellcheck="false">
        </textarea>


        <div class="counter-box">

            <div class="counter-card">
                <span id="word">0</span>
                <p>Words</p>
            </div>


            <div class="counter-card">
                <span id="char">0</span>
                <p>Characters</p>
            </div>


            <div class="counter-card">
                <span id="sentence">0</span>
                <p>Sentences</p>
            </div>

        </div>

    </main>


    <footer>
    <p>
        © 2026 
        <a href="https://github.com/probal2005" target="_blank">
            Probal Dhali ❤️
        </a>
        . All Rights Reserved.
    </p>
</footer>


    <script src="script.js"></script>

</body>

</html>
