<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Songify Music Player</title>

    <meta name="description" content="Modern JavaScript Music Player">

    <link rel="icon" href="assets/favicon.ico">

    <!-- Google Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Animated Background -->

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

    <!-- Back Button -->

    <div class="backbtn">
        <a href="/JavaScript-Projects/#project">
            <i class="fas fa-arrow-circle-left"></i>
        </a>
    </div>

    <div class="container">

        <!-- ===========================
             Music Player
        ============================ -->

        <div class="music_player">

            <div class="player-top">

                <span class="playing-now">

                    <i class="fas fa-headphones-alt"></i>

                    Now Playing

                </span>

                <lottie-player id="equalizer"
                    background="transparent"
                    speed="1"
                    style="width:45px;height:45px;"
                    loop
                    autoplay>
                </lottie-player>

            </div>

            <!-- Album -->

            <div class="imgBox">

                <img src="" alt="Album Cover" draggable="false">

            </div>

            <!-- Song -->

            <div class="songDetails">

                <h2 class="name">
                    Song Name
                </h2>

                <p class="artist">
                    Artist Name
                </p>

            </div>

            <!-- Progress -->

            <div class="progressBox">

                <div class="progress-area">

                    <div class="progress-bar"></div>

                </div>

                <div class="timer">

                    <span class="current">
                        00:00
                    </span>

                    <span class="duration">
                        00:00
                    </span>

                </div>

                <audio id="mainAudio"></audio>

            </div>

            <!-- Controls -->

            <div class="controls">

                <i id="repeat-plist"
                    class="material-icons-round"
                    title="Playlist Looped">
                    repeat
                </i>

                <i id="prev"
                    class="material-icons-round">
                    skip_previous
                </i>

                <div class="play-pause">

                    <i class="material-icons-round">
                        play_arrow
                    </i>

                </div>

                <i id="next"
                    class="material-icons-round">
                    skip_next
                </i>

                <i id="vol"
                    class="material-icons-round">
                    volume_up
                </i>

            </div>

        </div>

        <!-- ===========================
              Playlist
        ============================ -->

        <div class="music_list">

            <div class="list-header">

                <div>

                    <h3>

                        <i class="fas fa-music"></i>

                        Playlist

                    </h3>

                    <span>
                        Enjoy your favorite songs
                    </span>

                </div>

                <span id="song-count">
                    13 Songs
                </span>

            </div>

            <ul>
                <!-- Generated from songs.js -->
            </ul>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        Made with ❤️ by

        <a href="https://github.com/probal2005"
            target="_blank">

            Probal Dhali

        </a>

    </footer>

    <!-- Lottie -->

    <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>

    <!-- Song Data -->

    <script src="songs.js"></script>

    <!-- Main Script -->

    <script src="script.js"></script>

</body>

</html>
