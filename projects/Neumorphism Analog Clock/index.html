<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Neumorphism Analog Clock</title>

    <link
        rel="stylesheet"
        href="style.css">

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <script src="https://kit.fontawesome.com/64d58efce2.js" crossorigin="anonymous"></script>

</head>

<body>

    <!-- Theme Button -->

    <div class="toggleClass">

        <i class="fas fa-moon"></i>

    </div>

    <!-- Main Container -->

    <div class="container">

        <!-- Analog Clock -->

        <div class="clock">

            <div class="hour">

                <div class="hr" id="hr"></div>

            </div>

            <div class="min">

                <div class="mn" id="mn"></div>

            </div>

            <div class="sec">

                <div class="sc" id="sc"></div>

            </div>

        </div>

        <!-- Digital Information -->

        <div class="clock-info">

            <h2 id="digitalClock">

                00:00:00

            </h2>

            <p id="currentDate">

                Monday, January 1, 2026

            </p>

            <span id="timezone">

                Local Time

            </span>

        </div>

    </div>

    <!-- Footer -->

    <footer>

        <p>

            Made with ❤️ using HTML, CSS & JavaScript

        </p>

        <p>

            © 2026

            <a
                href="https://github.com/probal2005"
                target="_blank">

                Probal Dhali

            </a>

        </p>

    </footer>

    <!-- Vanilla Tilt -->

    <script
        type="text/javascript"
        src="vanilla-tilt.js">

    </script>

    <script src="script.js"></script>

</body>

</html>
