<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Advanced Counter App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <h1>
            <i class="fa-solid fa-calculator"></i>
            Advanced Counter
        </h1>

        <div class="counter-box">

            <div id="counter">0</div>

        </div>

        <!-- Buttons -->

        <div class="buttons">

            <button id="decrease">
                <i class="fas fa-minus"></i>
            </button>

            <button id="reset">
                <i class="fas fa-rotate-left"></i>
            </button>

            <button id="increase">
                <i class="fas fa-plus"></i>
            </button>

        </div>

        <!-- Extra Buttons -->

        <div class="extra-buttons">

            <button id="minus5">-5</button>

            <button id="plus5">+5</button>

            <button id="random">
                🎲 Random
            </button>

        </div>

        <!-- Statistics -->

        <div class="stats">

            <div class="card">

                <h3>Highest</h3>

                <p id="highest">0</p>

            </div>

            <div class="card">

                <h3>Lowest</h3>

                <p id="lowest">0</p>

            </div>

            <div class="card">

                <h3>Total Clicks</h3>

                <p id="clicks">0</p>

            </div>

        </div>

        <!-- Clock -->

        <div class="clock">

            <span id="time"></span>

        </div>

        <p class="hint">

            ⌨️ Keyboard Shortcuts

            <br>

            ↑ Increase |
            ↓ Decrease |
            R Reset

        </p>

    </div>

    <!-- Footer -->

    <footer>

        © 2026

        <a href="https://github.com/probal2005" target="_blank">

            Probal Dhali

        </a>

        | All Rights Reserved.

    </footer>

    <script src="script.js"></script>

</body>

</html>
